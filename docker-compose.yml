version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: trend-lens-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_trends
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: trend-lens-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: